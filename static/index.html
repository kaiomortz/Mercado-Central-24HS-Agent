<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agente Mercado Central 24h</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #0f172a;
            color: white;
            padding: 1rem 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        header h1 { font-size: 1.1rem; font-weight: 600; }
        header p { font-size: 0.8rem; color: #94a3b8; margin-top: 0.2rem; }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .msg {
            max-width: 80%;
            padding: 0.9rem 1.2rem;
            border-radius: 1rem;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: translateY(0);} }
        .user {
            align-self: flex-end;
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 0.2rem;
        }
        .bot {
            align-self: flex-start;
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 0.2rem;
        }
        .bot .fuentes {
            margin-top: 0.6rem;
            font-size: 0.75rem;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            padding-top: 0.5rem;
        }
        .typing {
            align-self: flex-start;
            background: white;
            border: 1px solid #e2e8f0;
            padding: 0.8rem 1.2rem;
            border-radius: 1rem;
            border-bottom-left-radius: 0.2rem;
            color: #64748b;
            font-size: 0.9rem;
            display: none;
        }
        #input-area {
            background: white;
            border-top: 1px solid #e2e8f0;
            padding: 1rem 1.5rem;
            display: flex;
            gap: 0.8rem;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        #msg-input {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 0.6rem;
            font-size: 1rem;
            outline: none;
        }
        #msg-input:focus { border-color: #2563eb; }
        #send-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0 1.5rem;
            border-radius: 0.6rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        #send-btn:hover { background: #1d4ed8; }
        #send-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .empty {
            text-align: center;
            color: #94a3b8;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>🛒 Mercado Central 24h</h1>
        <p>Agente de IA — Preguntá sobre políticas, inventario, proveedores y más</p>
    </header>

    <div id="chat">
        <div class="empty">Escribí tu pregunta para comenzar...</div>
    </div>

    <div class="typing" id="typing">Escribiendo...</div>

    <div id="input-area">
        <input type="text" id="msg-input" placeholder="¿Cuál es la política de devoluciones?" autocomplete="off">
        <button id="send-btn" onclick="enviar()">Enviar</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('msg-input');
        const typing = document.getElementById('typing');
        const btn = document.getElementById('send-btn');

        // Enviar con Enter
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviar();
        });

        async function enviar() {
            const pregunta = input.value.trim();
            if (!pregunta) return;

            // Limpiar estado inicial
            if (chat.querySelector('.empty')) chat.innerHTML = '';

            // Mostrar mensaje del usuario
            agregarMensaje(pregunta, 'user');
            input.value = '';
            typing.style.display = 'block';
            btn.disabled = true;

            try {
                // ACÁ ES LA CONEXIÓN CON TU API
                const res = await fetch('/preguntar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pregunta: pregunta })
                });

                const data = await res.json();

                // Mostrar respuesta del agente
                let html = data.respuesta;
                if (data.fuentes && data.fuentes.length > 0) {
                    html += `<div class="fuentes">📄 Fuentes: ${data.fuentes.join(', ')}</div>`;
                }
                agregarMensaje(html, 'bot');

            } catch (err) {
                agregarMensaje('❌ Error al contactar al agente. ¿Está corriendo el servidor?', 'bot');
            } finally {
                typing.style.display = 'none';
                btn.disabled = false;
                input.focus();
            }
        }

        function agregarMensaje(texto, tipo) {
            const div = document.createElement('div');
            div.className = `msg ${tipo}`;
            div.innerHTML = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }
    </script>

</body>
</html>
